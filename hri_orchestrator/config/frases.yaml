saludo: "Hello, welcome to the house. I am Martha."
preguntar: "What is your name and what is your favorite drink?"
repetir: "Sorry, I could not hear you well. Please tell me your name and your favorite drink again."
registrado: "Nice to meet you, {nombre}."
vamos_sofa: "Please follow me to the sofa."
pedir_orden: "{nombre}, what can I bring you?"
repetir_orden: "Sorry, I did not understand. Please tell me what object I should bring and from where."
voy_por: "I will bring you the {objeto} from the {lugar}."
lugar_desconocido: "Sorry, I do not know where the {lugar} is."
objeto_desconocido: "Sorry, I do not know the object {objeto}."
aqui_esta: "{nombre}, here is your {objeto}. Please take it from my hand."
presentar: "{nombre_a}, this is {nombre_b}. {nombre_b}'s favorite drink is {bebida_b}."
pedir_bolsa: "I am ready to receive your bag. Please place it in my hand."
bolsa_seguridad: "I detect the bag in my hand. I will close my gripper in 3 seconds, please be careful."
terminado: "Task finished."
